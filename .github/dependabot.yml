version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    # Dependabot still adds its own SemVer label. On a minor or major update the
    # PR then has two version labels, and label-check blocks it until one is
    # removed. auto-bump releases PaF from this label, so choose it by the effect
    # on PaF's CLI, not by the dependency's version.
    labels:
      - "dependencies"
      - "javascript"
      - "patch"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github_actions"
      - "patch"
    groups:
      actions:
        patterns:
          - "*"
