name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Check version sync
        run: |
          pkg_ver=$(node -e "console.log(require('./package.json').version)")
          plugin_ver=$(node -e "console.log(require('./.claude-plugin/plugin.json').version)")
          if [ "$pkg_ver" != "$plugin_ver" ]; then
            echo "::error::Version mismatch: package.json=$pkg_ver plugin.json=$plugin_ver"
            exit 1
          fi
      - run: npm run plugins:check
      - name: Validate Claude manifests
        run: |
          npx --yes --package @anthropic-ai/claude-code@2.1.286 claude plugin validate .claude-plugin/plugin.json --strict
          npx --yes --package @anthropic-ai/claude-code@2.1.286 claude plugin validate .claude-plugin/marketplace.json --strict
          npx --yes --package @anthropic-ai/claude-code@2.1.286 claude plugin validate plugins/claude/.claude-plugin/plugin.json --strict
      - run: npm run plugins:pack
      - name: Check dist is up to date
        run: |
          npm run build
          if ! git diff --quiet dist/; then
            echo "::error::dist/ is out of date — run 'npm run build' and commit"
            exit 1
          fi
      - name: Verify dist is self-contained
        run: |
          mv node_modules node_modules_bak
          node dist/index.js --version
          mv node_modules_bak node_modules
      - run: npm test
      - run: npm run typecheck

  paf-tasks:
    # The Claude Code mod in mods/paf-tasks/ (needs Claude Code 2.1.287+).
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: "2.1.289"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate the marketplace and the mod
        run: |
          npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict .
          npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict mods/paf-tasks
      - name: Test the mod
        run: npx -y "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin test mods/paf-tasks

  tests:
    needs: [test-node, paf-tasks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-node.result }}" != "success" ] || [ "${{ needs.paf-tasks.result }}" != "success" ]; then
            exit 1
          fi
